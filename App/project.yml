name: Notan
options:
  deploymentTarget:
    macOS: "15.0"
packages:
  Notan:
    path: ..
targets:
  Notan:
    type: application
    platform: macOS
    sources: [Main]
    dependencies:
      - package: Notan
        product: NotanUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.timosci.Notan
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_NSHighResolutionCapable: YES
